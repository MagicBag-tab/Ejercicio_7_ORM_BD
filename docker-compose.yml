version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: concesionaria_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - concesionaria

  webserver:
    image: nginx:alpine
    container_name: concesionaria_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - concesionaria

  db:
    image: mysql:8.0
    container_name: concesionaria_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: concesionaria
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_PASSWORD: secret
      MYSQL_USER: laravel
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - concesionaria

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: concesionaria_pma
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: secret
    networks:
      - concesionaria

networks:
  concesionaria:
    driver: bridge

volumes:
  dbdata:
    driver: local